changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
  - label: Added
    auto: minor
  - label: Changed
    auto: minor
  - label: Deprecated
    auto: minor
  - label: Removed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Security
    auto: patch
newlines:
  afterChangelogHeader: 1
  afterChangelogVersion: 1
  endOfVersion: 1
  beforeKind: 1
  afterKind: 1
envPrefix: CHANGIE_
replacements:
  - path: build.zig.zon
    find: '\.version = "[^"]+"'
    replace: '.version = "{{.VersionNoPrefix}}"'
  - path: src/main.zig
    find: 'const version = "ccuzage v[^"]+"'
    replace: 'const version = "ccuzage v{{.VersionNoPrefix}}"'
